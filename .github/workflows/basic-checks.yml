# Pull Request の機械チェック。
#
# **人間が読む前に、機械で分かることは機械が見る。** ここで見るのは
# 「壊れているかどうか」だけで、設計の良し悪しは判断しない。
#
# 中身は scripts/ci/ にある。手元でも同じものを実行できる:
#     python3 scripts/ci/basic_checks.py
#     python3 scripts/ci/import_check.py
#
# 除外は .ci-ignore（ファイル）と .ci-imports-allow（依存）で指定する。
name: basic-checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 構文チェックは実行環境の Python 版に依存する。
      # 本番と同じ 3.10 で見ないと、3.12 で通る書き方を見逃す。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: PyYAML を入れる
        run: python -m pip install --quiet pyyaml

      - name: 機械チェック
        run: python scripts/ci/basic_checks.py

      # 「手元では動くのに新しい環境で ModuleNotFoundError」を止める。
      # 実際にインストールはしない（torch や CUDA を入れると CI が重すぎる）。
      - name: 依存の宣言漏れ
        run: python scripts/ci/import_check.py

      # ガードの回帰テスト。 主張ではなく実行で確かめる。
      - name: guard-main.sh の回帰テスト
        run: bash scripts/ci/test_guard_main.sh

      # **Organization 監査の判定が崩れていないこと。**
      # 所見 / Exception / UNKNOWN の 3 つを混ぜると「直せるもの」が
      # 埋もれる。 実際に Plan 制約の 403 を UNKNOWN にも数えていて、
      # 同じ事実が 2 箇所に出ていた。
      # 監査そのもの（org_audit.py）は Organization を叩くので CI では
      # 走らせない。 権限や Plan で結果が変わり、 テストが信用できなくなる。
      - name: Organization 監査の判定
        run: python scripts/ci/test_org_audit.py

      # **Issue の種別を付ける経路が崩れていないこと。**
      # 直近の Issue 71 件はすべて種別なしだった。 Form も /issue も種別を
      # 指定していなかったためで、 種別を足しただけでは使われない。
      # Form の type: と、 それを読む issue-form.sh を確かめる（gh は差し替え）。
      - name: Issue Form の種別
        run: python scripts/ci/test_issue_form.py

      # **秘密情報の走査が、 拡張子で取りこぼさないこと。**
      # 複製されていた旧版は `.env` や拡張子の無いファイルを丸ごと
      # 飛ばしていた（実在の `configs/active_profile` が該当）。
      # 再利用 workflow から呼ぶときに validator が自分自身を検査して
      # しまわないこと（`CI_ROOT`）も、 ここで見る。
      - name: 秘密情報の走査と CI_ROOT
        run: python scripts/ci/test_secret_scan.py

      # **複製のずれを見つける側が壊れていないこと。**
      # 見つける側が壊れると、 改善が 1 Repository に閉じ込められる状態に
      # 戻る。 実際に 3 回起きた。
      - name: 複製の照合そのもの
        run: python scripts/ci/test_copy_sync.py

      # **版と配置の記録の検査そのもの。**
      # 「deployed_release に書いた版が無い」「rollback が今の版と同じ」は
      # 必要になった瞬間まで気づけない。 見つける側が壊れたら意味が無い。
      - name: 版と配置の記録の検査
        run: python scripts/ci/test_release_record.py

      # **このリポジトリは Public。** 顧客の値が入ると、 取り消せない形で
      # 外へ出る。 それなのに検査が無く、 Private な Core 2 件にだけ
      # あった（必要な順番が逆）。
      # **再利用 workflow には入れない。** 顧客 Repository の config/ には
      # PLC の IP が正当に入るため、 毎回 NG になって誰も見なくなる。
      - name: 現場の値が混ざっていないか
        run: python scripts/ci/customer_data_check.py

      - name: 混入の検査そのもの
        run: python scripts/ci/test_customer_data.py
