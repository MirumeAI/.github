# 開発の機体の設定の見本（値を入れない）。 形の正本は MirumeAI/development-docs の
# 03_customer_development/recipes_and_machines.md の「machines/<機体の記号>.yaml」。
#
# 使い方: 案件のフォルダの config/ へ <機体の記号>.yaml の名前で写し（この Repository の外）、 machine.symbol を
# ファイルの名前と同じにして値を入れる。 開発の機体の設定（kind: dev）は Git に置かない。
schema_version: 1
machine:
  symbol: DEV01                 # ファイルの名前（.yaml を除く）と同じにする
  kind: dev                     # 開発の機体
work_root: /path/to/work_root   # 作業ルート（絶対の道。 Core の clone とこの Repository の外）
weights_root: /path/to/weights  # 重みの置き場（絶対の道）
ports:
  ui:                           # 検査の Web アプリのポート
  pdm:                          # PDM の Web アプリ（門番）のポート
extra_origins: []               # 画面を別の名前で開くときだけ書く
profile:                        # recipes/case.yaml の profile に重ねる（機体の値だけ。 カメラは camera.<役> の下）
  paths:
    data: /path/to/work_root/data
