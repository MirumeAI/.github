# Pull Request の機械チェック。
#
# **人間が読む前に、機械で分かることは機械が見る。** ここで見るのは
# 「壊れているかどうか」だけで、設計の良し悪しは判断しない。
#
# 中身は scripts/ci/ にある。手元でも同じものを実行できる:
#     python3 scripts/ci/basic_checks.py
#     python3 scripts/ci/import_check.py
#
# 除外は .ci-ignore（ファイル）と .ci-imports-allow（依存）で指定する。
name: basic-checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 構文チェックは実行環境の Python 版に依存する。
      # 本番と同じ 3.10 で見ないと、3.12 で通る書き方を見逃す。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: PyYAML を入れる
        run: python -m pip install --quiet pyyaml

      - name: 機械チェック
        run: python scripts/ci/basic_checks.py

      # 「手元では動くのに新しい環境で ModuleNotFoundError」を止める。
      # 実際にインストールはしない（torch や CUDA を入れると CI が重すぎる）。
      - name: 依存の宣言漏れ
        run: python scripts/ci/import_check.py

      # ガードの回帰テスト。 主張ではなく実行で確かめる。
      - name: guard-main.sh の回帰テスト
        run: bash scripts/ci/test_guard_main.sh

      # **Organization 監査の判定が崩れていないこと。**
      # 所見 / Exception / UNKNOWN の 3 つを混ぜると「直せるもの」が
      # 埋もれる。 実際に Plan 制約の 403 を UNKNOWN にも数えていて、
      # 同じ事実が 2 箇所に出ていた。
      # 監査そのもの（org_audit.py）は Organization を叩くので CI では
      # 走らせない。 権限や Plan で結果が変わり、 テストが信用できなくなる。
      - name: Organization 監査の判定
        run: python scripts/ci/test_org_audit.py

      # **Issue の種別を付ける経路が崩れていないこと。**
      # 直近の Issue 71 件はすべて種別なしだった。 Form も /issue も種別を
      # 指定していなかったためで、 種別を足しただけでは使われない。
      # Form の type: と、 それを読む issue-form.sh を確かめる（gh は差し替え）。
      - name: Issue Form の種別
        run: python scripts/ci/test_issue_form.py

      # **秘密情報の走査が、 拡張子で取りこぼさないこと。**
      # 複製されていた旧版は `.env` や拡張子の無いファイルを丸ごと
      # 飛ばしていた（実在の `configs/active_profile` が該当）。
      # 再利用 workflow から呼ぶときに validator が自分自身を検査して
      # しまわないこと（`CI_ROOT`）も、 ここで見る。
      - name: 秘密情報の走査と CI_ROOT
        run: python scripts/ci/test_secret_scan.py

      # **機械チェックが、 CI の記録に入力の中身と顧客に固有の道を出さないこと**
      # （#50）。 顧客 Repository の設定の道や中身には、 案件に固有の名前と
      # 値が入る。 架空の値で、 壊れた YAML の行・道の中の名前・例外・命令の
      # 注入を流し、 守りを 1 つずつ壊すと落ちることも確かめる。
      - name: 機械チェックが記録に値と道を出さないこと
        run: python scripts/ci/test_basic_checks_log_safety.py

      # **複製のずれを見つける側が壊れていないこと。**
      # 見つける側が壊れると、 改善が 1 Repository に閉じ込められる状態に
      # 戻る。 実際に 3 回起きた。
      - name: 複製の照合そのもの
        run: python scripts/ci/test_copy_sync.py

      # **顧客案件の Repository を作る道具が、 漏れなく作ること。**
      # 手で作ると、 main を守る hook、 Team の権限、 Squash だけにする
      # 設定、 Dependabot Alerts が漏れても気づけなかった。 作った中身が
      # 新しい Repository の最初の CI を通ることまで確かめる（gh は差し替え）。
      - name: 顧客案件の Repository を作る道具
        run: python scripts/ci/test_new_customer_repo.py

      # **版と配置の記録の検査そのもの。**
      # 「deployed_release に書いた版が無い」「rollback が今の版と同じ」は
      # 必要になった瞬間まで気づけない。 見つける側が壊れたら意味が無い。
      - name: 版と配置の記録の検査
        run: python scripts/ci/test_release_record.py

      # **Product Release の識別の確かめそのもの。**
      # 各 Core の Release の workflow が、 注釈つき・main の祖先・版の一致・
      # 開発の版でないこと・タグが動いていないことを、 この道具で確かめる。
      # 見つける側が壊れていると、 同じ版を名乗る別のコードを Release にしてしまう。
      - name: Product Release の識別の確かめ
        run: python scripts/ci/test_release_identity.py

      # **VERSION の形。** Release の版（X.Y.Z）と開発の版（X.Y.Z.devN）だけを許す。
      - name: VERSION の形
        run: python scripts/ci/test_version_format.py

      # **このリポジトリは Public。** 顧客の値が入ると、 取り消せない形で
      # 外へ出る。 それなのに検査が無く、 Private な Core 2 件にだけ
      # あった（必要な順番が逆）。
      # **再利用 workflow には入れない。** 顧客 Repository の config/ には
      # PLC の IP が正当に入るため、 毎回 NG になって誰も見なくなる。
      # **顧客の名前の登録表は渡さない（この workflow は secret を使わない）。**
      # PR の code が動くので、 書き込み権限で workflow を変えれば secret を
      # 読み出せてしまう。 名前の照合は、 手元の登録表か、 main の検査だけが
      # 登録表を読む仕組みで行う（ここでは「照合していません」と出る）。
      - name: 現場の値が混ざっていないか
        run: python scripts/ci/customer_data_check.py

      - name: 混入の検査そのもの
        run: python scripts/ci/test_customer_data.py

      # **顧客の間の混入の検査そのもの。** 顧客 Repository の最初の登録で、
      # 別の案件の構成のファイルと PLC の表が入り、 名前の検査にも配る道具の
      # 確かめにも見つからなかった。 それを架空の 2 つの案件で再現し、 検査の
      # 守りを 1 つずつ壊すと落ちることも確かめる。 PyYAML が要る（上で入れる）。
      - name: 顧客の間の混入の検査そのもの
        run: python scripts/ci/test_customer_isolation.py

      # **merge の前提の検査（Required Verification）を流す道具そのもの。**
      # Private の Repository は Actions を使わないので、 この道具の PASS が
      # merge の前提になる。 段を黙って飛ばす・落ちた段を通す・知らない書き方を
      # 読み流すと、 確かめていない head が merge される。 小さな Repository で
      # 実際に流して確かめる（守りを 1 つずつ壊すと落ちることも確かめた）。
      - name: 手元の検査を流す道具
        run: python scripts/ci/test_run_required_verification.py
