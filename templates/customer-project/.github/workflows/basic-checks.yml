# Pull Request の機械チェック。
#
# **validator の正本は `MirumeAI/.github`。** 各 Repository へ複製すると、
# 改善が 1 Repository に閉じ込められる。 実際にそうなっていた。
name: basic-checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: MirumeAI/.github/.github/workflows/basic-checks-reusable.yml@main
    # 別の案件の値の混入を、 根の customer-profile.yaml（この案件の宣言）と照らすか。
    # **人が宣言の値を確かめ、 状態を VERIFIED にするまで true にしない**
    # （README の「顧客の間の混入の検査を始める」）。
    with:
      run-isolation-check: false
