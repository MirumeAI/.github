# この案件が次の System Release で使う Core の組合せ（選択だけ）。
#
# **浮動 Branch 名や latest で本番構成を管理しない。** Product Release のタグと、
# タグが指す commit で固定する。 どの版で動いているかが分からないと、 不具合の
# 再現も切り戻しもできない。 配置（どの機体で何が動いているか）・検証の状態・
# 移行の経緯はここに書かない（deployment/・validation/・Issue）。
#
# - 使う Core を決めるまでは、 tag と commit の両方を null（未選択）にする
# - pdm の行は、 撮像側のタグの commit にある pdm.lock.json と同じにする（組合せの
#   正本は撮像側の lock で、 ここは写し）。 撮像側を選ばずに pdm だけを選ばない
# - 開発中に Core の commit を固定するときは、 このファイルでなく versions.dev.yaml
#   （任意）に書く。 System Release はこのファイルだけを参照するので、 そこに書いた版は
#   機体に配置できない
# - 選んだ Core の節には、 配布物の hash を任意で書ける（64 桁の小文字の 16 進。 MirumeAI/.github#204）:
#   sha256sums_sha256（その Product Release の配布物の束の SHA256SUMS の sha256）と、
#   wheel_sha256（本体の wheel の sha256）。 どちらも Core の記録（releases/vX.Y.Z.json）の
#   同じ名前の鍵から写す。 据え付けの入れ方は、 束と wheel をこの値と照らしてから、
#   index を使わずに入れる（無い・違うときは入れずに止める）。 未選択の Core には書かない
# - 確かめる道具は MirumeAI/.github の scripts/ci/release_record_check.py
schema_version: 2

