# Pull Request の機械チェック。
#
# **人間が読む前に、機械で分かることは機械が見る。** ここで見るのは
# 「壊れているかどうか」だけで、設計の良し悪しは判断しない。
#
# 中身は scripts/ci/ にある。手元でも同じものを実行できる:
#     python3 scripts/ci/basic_checks.py
#     python3 scripts/ci/import_check.py
#
# 除外は .ci-ignore（ファイル）と .ci-imports-allow（依存）で指定する。
name: basic-checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 構文チェックは実行環境の Python 版に依存する。
      # 本番と同じ 3.10 で見ないと、3.12 で通る書き方を見逃す。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: PyYAML を入れる
        run: python -m pip install --quiet pyyaml

      - name: 機械チェック
        run: python scripts/ci/basic_checks.py

      # 「手元では動くのに新しい環境で ModuleNotFoundError」を止める。
      # 実際にインストールはしない（torch や CUDA を入れると CI が重すぎる）。
      - name: 依存の宣言漏れ
        run: python scripts/ci/import_check.py

      # ガードの回帰テスト。 主張ではなく実行で確かめる。
      - name: guard-main.sh の回帰テスト
        run: bash scripts/ci/test_guard_main.sh

      # **Organization 監査の判定が崩れていないこと。**
      # 所見 / Exception / UNKNOWN の 3 つを混ぜると「直せるもの」が
      # 埋もれる。 実際に Plan 制約の 403 を UNKNOWN にも数えていて、
      # 同じ事実が 2 箇所に出ていた。
      # 監査そのもの（org_audit.py）は Organization を叩くので CI では
      # 走らせない。 権限や Plan で結果が変わり、 テストが信用できなくなる。
      - name: Organization 監査の判定
        run: python scripts/ci/test_org_audit.py
